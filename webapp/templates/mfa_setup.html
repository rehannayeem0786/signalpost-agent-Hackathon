{% extends "base.html" %}
{% block title %}Enable MFA — Signalpost{% endblock %}
{% block content %}
<h1>Enable two-factor authentication</h1>
<div class="card">
  <p>Add this secret to your authenticator app:</p>
  <p class="mono">{{ secret }}</p>
  <p class="muted">otpauth URI: <span class="mono">{{ otpauth_uri }}</span></p>
  <form method="post" action="/account/mfa/confirm">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="code">Confirm with a code</label>
    <input id="code" name="code" type="text" inputmode="numeric" required>
    <p><button type="submit">Confirm &amp; activate</button></p>
  </form>
</div>
{% endblock %}
